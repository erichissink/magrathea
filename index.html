<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eric's Energy Dashboard</title>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #22c55e;
  --text: #f8fafc;
  --muted: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Segoe UI, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
}

.label {
  color: var(--muted);
  font-size: 14px;
}

.value {
  font-size: 42px;
  font-weight: 700;
  margin-top: 10px;
}

.green {
  color: var(--accent);
}

.bar {
  height: 14px;
  background: #334155;
  border-radius: 9px;
  overflow: hidden;
  margin-top: 12px;
}

.fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#16a34a,#4ade80);
  transition: width 0.5s ease;
}

.footer {
  margin-top: 30px;
  color: var(--muted);
  font-size: 12px;
}
</style>
</head>

<body>

<h1>⚡ Eric's Energy Dashboard</h1>

<div class="grid">

  <div class="card">
    <div class="label">Batterij SOC</div>
    <div class="value green" id="soc">--%</div>
    <div class="bar">
      <div class="fill" id="socbar"></div>
    </div>
  </div>

  <div class="card">
    <div class="label">Laadstatus</div>
    <div class="value" id="status">laden...</div>
  </div>

  <div class="card">
    <div class="label">Stroomprijs</div>
    <div class="value" id="price">--</div>
  </div>

  <div class="card">
    <div class="label">Resultaat Vandaag</div>
    <div class="value green" id="profit">--</div>
  </div>

</div>

<div class="footer">
Laatste update: <span id="time"></span>
</div>

<script>

document.getElementById("time").innerText =
new Date().toLocaleString("nl-NL");

fetch("./data.json")
  .then(response => response.json())
  .then(data => {

    if (data.soc !== undefined) {
      document.getElementById("soc").innerText =
        data.soc + "%";

      document.getElementById("socbar").style.width =
        data.soc + "%";
    }

    if (data.mode !== undefined) {
      document.getElementById("status").innerText =
        data.mode;
    }

    if (data.price !== undefined) {
      document.getElementById("price").innerText =
        "€" + Number(data.price).toFixed(3);
    }

    if (data.profit_today !== undefined) {
      document.getElementById("profit").innerText =
        "€" + Number(data.profit_today).toFixed(2);
    }

    if (data.updated !== undefined) {
      document.getElementById("time").innerText =
        data.updated;
    }
  })
  .catch(error => {
    console.error("Fout bij laden data.json:", error);

    document.getElementById("status").innerText =
      "data.json niet gevonden";
  });

</script>

</body>
</html>
